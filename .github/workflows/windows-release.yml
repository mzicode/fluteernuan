name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CUSTOMER_IM_SERVER_URL: ${{ vars.CUSTOMER_IM_SERVER_URL }}
      CUSTOMER_IM_WS_URL: ${{ vars.CUSTOMER_IM_WS_URL }}
      CUSTOMER_IM_BOOTSTRAP_URL: ${{ vars.CUSTOMER_IM_BOOTSTRAP_URL }}
      CUSTOMER_IM_PUBLIC_H5_URL: ${{ vars.CUSTOMER_IM_PUBLIC_H5_URL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Redirect Agora SDK extraction
        shell: pwsh
        run: |
          $packageConfig = Get-Content '.dart_tool/package_config.json' -Raw | ConvertFrom-Json
          $agoraPackage = $packageConfig.packages | Where-Object { $_.name -eq 'agora_rtc_engine' } | Select-Object -First 1
          if ($null -eq $agoraPackage) { throw 'agora_rtc_engine was not found in package_config.json' }
          $agoraRoot = ([Uri]$agoraPackage.rootUri).LocalPath
          $downloadScript = Join-Path $agoraRoot 'windows/cmake/DownloadSDK.cmake'
          if (-not (Test-Path $downloadScript)) { throw "Agora DownloadSDK.cmake not found: $downloadScript" }
          $agoraSdkRoot = (Join-Path $env:RUNNER_TEMP 'nuanlin-agora-sdk').Replace('\', '/')
          Remove-Item -LiteralPath $agoraSdkRoot -Recurse -Force -ErrorAction SilentlyContinue
          $content = Get-Content $downloadScript -Raw
          $content = $content.Replace('set(IRIS_DOWNLOAD_PATH "${CMAKE_CURRENT_SOURCE_DIR}/third_party/iris")', "set(IRIS_DOWNLOAD_PATH `"$agoraSdkRoot/iris`")")
          $content = $content.Replace('set(NATIVE_DOWNLOAD_PATH "${CMAKE_CURRENT_SOURCE_DIR}/third_party/native")', "set(NATIVE_DOWNLOAD_PATH `"$agoraSdkRoot/native`")")
          Set-Content -Path $downloadScript -Value $content -Encoding UTF8
          Select-String -Path $downloadScript -Pattern 'DOWNLOAD_PATH'

      - name: Build Windows Release
        shell: pwsh
        run: |
          $serverUrl = $env:CUSTOMER_IM_SERVER_URL
          if ([string]::IsNullOrWhiteSpace($serverUrl)) { $serverUrl = 'https://web.cybndo.com' }
          $wsUrl = $env:CUSTOMER_IM_WS_URL
          if ([string]::IsNullOrWhiteSpace($wsUrl)) { $wsUrl = 'wss://web.cybndo.com/api/v1/ws' }
          $bootstrapUrl = $env:CUSTOMER_IM_BOOTSTRAP_URL
          if ([string]::IsNullOrWhiteSpace($bootstrapUrl)) { $bootstrapUrl = "$serverUrl/api/v1/client/bootstrap" }
          $publicH5Url = $env:CUSTOMER_IM_PUBLIC_H5_URL

          if ($serverUrl -notmatch '^https://') { throw 'CUSTOMER_IM_SERVER_URL must use https://' }
          if ($wsUrl -notmatch '^wss://') { throw 'CUSTOMER_IM_WS_URL must use wss://' }
          if ($bootstrapUrl -notmatch '^https://') { throw 'CUSTOMER_IM_BOOTSTRAP_URL must use https://' }
          if ($serverUrl -match 'localhost|127\.0\.0\.1|10\.0\.2\.2') { throw 'Local server URL is not allowed' }
          if ($wsUrl -match 'localhost|127\.0\.0\.1|10\.0\.2\.2') { throw 'Local WebSocket URL is not allowed' }

          $defines = @(
            "--dart-define=CUSTOMER_IM_SERVER_URL=$serverUrl",
            "--dart-define=CUSTOMER_IM_WS_URL=$wsUrl",
            "--dart-define=CUSTOMER_IM_BOOTSTRAP_URL=$bootstrapUrl"
          )
          if (-not [string]::IsNullOrWhiteSpace($publicH5Url)) {
            if ($publicH5Url -notmatch '^https://') { throw 'CUSTOMER_IM_PUBLIC_H5_URL must use https://' }
            $defines += "--dart-define=CUSTOMER_IM_PUBLIC_H5_URL=$publicH5Url"
          }
          $buildLog = Join-Path $PWD 'windows-build.log'
          $buildOutput = & flutter build windows --release --no-pub @defines 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | Tee-Object -FilePath $buildLog
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Flutter Windows build output`n````text`n$($buildOutput -join "`n")`n````"
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = Join-Path $PWD 'dist/windows-installer'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            '/DMyAppName=暖邻' `
            '/DMyAppVersion=1.0.1' `
            'windows/installer/customer_setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $outputDir -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content "$($_.FullName).sha256.txt"
          }

      - name: Archive portable Release
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/windows-installer/暖邻-Windows-Release.zip'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nuanlin-windows-release
          path: dist/windows-installer/
          if-no-files-found: error

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nuanlin-windows-build-log
          path: windows-build.log
          if-no-files-found: ignore
