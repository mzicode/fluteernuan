name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CUSTOMER_IM_SERVER_URL: ${{ vars.CUSTOMER_IM_SERVER_URL }}
      CUSTOMER_IM_WS_URL: ${{ vars.CUSTOMER_IM_WS_URL }}
      CUSTOMER_IM_BOOTSTRAP_URL: ${{ vars.CUSTOMER_IM_BOOTSTRAP_URL }}
      CUSTOMER_IM_PUBLIC_H5_URL: ${{ vars.CUSTOMER_IM_PUBLIC_H5_URL }}
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Flutter doctor
        shell: pwsh
        run: flutter doctor -v

      - name: Prepare Agora and Firebase native SDKs
        shell: pwsh
        run: ./tool/windows/prepare_windows_native_sdks.ps1

      - name: Build Windows Release
        shell: pwsh
        run: |
          $serverUrl = $env:CUSTOMER_IM_SERVER_URL
          if ([string]::IsNullOrWhiteSpace($serverUrl)) { $serverUrl = 'https://web.cybndo.com' }
          $wsUrl = $env:CUSTOMER_IM_WS_URL
          if ([string]::IsNullOrWhiteSpace($wsUrl)) { $wsUrl = 'wss://web.cybndo.com/api/v1/ws' }
          $bootstrapUrl = $env:CUSTOMER_IM_BOOTSTRAP_URL
          if ([string]::IsNullOrWhiteSpace($bootstrapUrl)) { $bootstrapUrl = "$serverUrl/api/v1/client/bootstrap" }
          $publicH5Url = $env:CUSTOMER_IM_PUBLIC_H5_URL

          if ($serverUrl -notmatch '^https://') { throw 'CUSTOMER_IM_SERVER_URL must use https://' }
          if ($wsUrl -notmatch '^wss://') { throw 'CUSTOMER_IM_WS_URL must use wss://' }
          if ($bootstrapUrl -notmatch '^https://') { throw 'CUSTOMER_IM_BOOTSTRAP_URL must use https://' }
          if ($serverUrl -match 'localhost|127\.0\.0\.1|10\.0\.2\.2') { throw 'Local server URL is not allowed' }
          if ($wsUrl -match 'localhost|127\.0\.0\.1|10\.0\.2\.2') { throw 'Local WebSocket URL is not allowed' }

          $defines = @(
            "--dart-define=CUSTOMER_IM_SERVER_URL=$serverUrl",
            "--dart-define=CUSTOMER_IM_WS_URL=$wsUrl",
            "--dart-define=CUSTOMER_IM_BOOTSTRAP_URL=$bootstrapUrl"
          )
          if (-not [string]::IsNullOrWhiteSpace($publicH5Url)) {
            if ($publicH5Url -notmatch '^https://') { throw 'CUSTOMER_IM_PUBLIC_H5_URL must use https://' }
            $defines += "--dart-define=CUSTOMER_IM_PUBLIC_H5_URL=$publicH5Url"
          }

          $env:CMAKE_BUILD_PARALLEL_LEVEL = $env:NUMBER_OF_PROCESSORS
          $env:CL = '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
          $buildLog = Join-Path $PWD 'windows-build.log'
          Write-Host "Building with $($defines -join ' ')"
          $buildOutput = & flutter build windows --release --verbose --no-pub @defines 2>&1
          $buildExitCode = $LASTEXITCODE
          $buildOutput | Tee-Object -FilePath $buildLog
          if ($env:GITHUB_STEP_SUMMARY) {
            $errors = $buildOutput | Select-String -Pattern 'error C|error STL|CMake Error|Build process failed|fatal error' | Select-Object -Last 40
            $preview = ($buildOutput | Select-Object -Last 80) -join "`n"
            $errorText = if ($errors) { ($errors | ForEach-Object { $_.Line }) -join "`n" } else { '(no compiler error lines captured)' }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Compiler errors`n``````text`n$errorText`n``````"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Flutter Windows build tail`n``````text`n$preview`n``````"
          }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

          $exe = 'build/windows/x64/runner/Release/customer.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Release exe was not produced: $exe" }
          Get-Item -LiteralPath $exe | Format-List FullName, Length, LastWriteTime

      - name: Collect CMake diagnostics
        if: failure()
        shell: pwsh
        run: |
          $diagDir = Join-Path $PWD 'windows-cmake-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $patterns = @('CMakeError.log', 'CMakeOutput.log', 'err', 'out')
          Get-ChildItem -Path 'build/windows' -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $patterns -contains $_.Name -or $_.Name -like '*.log' } |
            Select-Object -First 40 |
            ForEach-Object {
              $relative = $_.FullName.Substring((Resolve-Path 'build/windows').Path.Length).TrimStart('\')
              $target = Join-Path $diagDir ($relative -replace '[\\/]', '_')
              Copy-Item -LiteralPath $_.FullName -Destination $target -Force
            }
          Get-ChildItem $diagDir | ForEach-Object { Write-Host $_.Name }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = Join-Path $PWD 'dist/windows-installer'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $version = '1.0.1'
          $pubspec = Get-Content 'pubspec.yaml' -Raw
          if ($pubspec -match '(?m)^version:\s*([^\s+]+)') {
            $version = $Matches[1]
          }
          $outputBase = "NuanLin-Windows-Setup-$version"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            '/DMyAppName=暖邻' `
            "/DMyAppVersion=$version" `
            "/DOutputBaseFilename=$outputBase" `
            'windows/installer/customer_setup.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $outputDir -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Set-Content -Encoding ascii "$($_.FullName).sha256.txt"
          }

      - name: Archive portable Release
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/windows-installer/NuanLin-Windows-Release.zip' -Force
          $zip = Get-Item 'dist/windows-installer/NuanLin-Windows-Release.zip'
          (Get-FileHash $zip.FullName -Algorithm SHA256).Hash | Set-Content -Encoding ascii "$($zip.FullName).sha256.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nuanlin-windows-release
          path: dist/windows-installer/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows ${{ github.run_number }}
          files: dist/windows-installer/*
          generate_release_notes: true

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nuanlin-windows-build-log
          path: |
            windows-build.log
            windows-cmake-diagnostics/
          if-no-files-found: ignore
